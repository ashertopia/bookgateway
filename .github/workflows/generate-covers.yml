name: Generate Book Covers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate covers and ISBNs
        run: python3 generate_covers.py

      - name: Update Amazon links on post pages
        run: python3 update_amazon_links.py

      - name: Commit if changed
        run: |
          git config user.name  "BookGateway Bot"
          git config user.email "bot@bookgateway.com"
          git add covers.json posts/
          git diff --staged --quiet && echo "No changes" && exit 0
          COVERS=$(python3 -c "import json; d=json.load(open('covers.json')); print(sum(1 for v in d.values() if v and v.get('cover')))")
          ISBNS=$(python3 -c "import json; d=json.load(open('covers.json')); print(sum(1 for v in d.values() if v and v.get('isbn10')))")
          git commit -m "chore: covers=${COVERS} isbn10s=${ISBNS} [skip ci]"
          git push
